# Switchboard's tmux, and only Switchboard's. The app talks to a tmux server on its
# own socket (tmux -L switchboard) started with this file, so nothing here touches
# the user's own tmux. ARCHITECTURE §5 M6.
#
# tmux is here for one thing: a shell that outlives the app, so quitting Switchboard
# and opening it again brings every terminal back where it was, Claude mid-turn
# included. Everything tmux would otherwise draw or intercept on its own is off.

set -g status off                    # no bar: the pane is the whole terminal
set -g prefix None                   # no prefix key: every keystroke is the program's
set -g prefix2 None
set -s escape-time 0                 # Esc is Esc, now — Claude Code reads it to interrupt
set -g mouse off                     # the pane's own scrolling and selection stay native
set -g history-limit 2000            # copy mode is never entered; the pane keeps the history

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
# No alternate screen on the outer terminal. With it, a line that scrolls off the top
# is gone — xterm.js keeps no scrollback in its alternate buffer — and the pane's
# own scrollback, which the user scrolls with the wheel, would stay empty.
set -as terminal-overrides ",xterm*:smcup@:rmcup@"
# And no "scroll N lines" (indn, CSI S) either: xterm.js drops the lines that
# sequence scrolls off instead of keeping them, so a burst of output would leave no
# scrollback. Without it tmux scrolls one newline at a time, which xterm.js keeps.
set -as terminal-overrides ",xterm*:indn@"
# OSC 52 from inside — Claude Code's /copy — is handed to the outer terminal, where
# the pane's handler puts it on the system clipboard.
set -s set-clipboard on
set -as terminal-overrides ',xterm*:Ms=\E]52;%p1%s;%p2%s\a'
set -g allow-passthrough on
set -g focus-events on

set -g bell-action any               # a bell inside rings the pane, and so the rail's dot
set -g visual-bell off
set -g monitor-bell on
set -g set-titles off

set -g destroy-unattached off        # the whole point: a session with no client lives on
set -g detach-on-destroy on
set -g exit-empty on                 # the server goes when the last shell does
set -g window-size latest
